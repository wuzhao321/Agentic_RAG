services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb_local
      POSTGRES_DB: kb
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - backend_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kb"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  backend_pgdata:
