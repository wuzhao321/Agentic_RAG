[project]
name = "kb-rag-agent"
version = "0.1.0"
description = "企业知识库 RAG 与 LangGraph Agent"
requires-python = ">=3.11,<3.13"
dependencies = [
  "langchain-core>=1.0,<2", "langchain-text-splitters>=1.0,<2",
  "langchain-openai>=1.0,<2", "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4", "chromadb>=1.0,<2",
  "rank-bm25>=0.2.2,<0.3", "jieba>=0.42.1,<0.43",
  "python-docx>=1.2,<2", "pymupdf>=1.26,<2", "rapidfuzz>=3,<4",
  "pydantic>=2.10,<3", "pyyaml>=6,<7", "python-dotenv>=1,<2",
  "typer>=0.16,<1", "rich>=14,<15",
]

[project.optional-dependencies]
models = ["sentence-transformers>=5,<6", "torch>=2.6,<3"]
# RAGAS 0.3.9 imports VertexAI paths removed by langchain-community 0.4.
eval = [
    "ragas==0.3.9",
    "datasets>=4,<5",
    "langchain-community==0.3.31",
    "docx2txt>=0.9,<1",
]
local = ["mlx-lm>=0.28,<0.32; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
kb = "kb.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
