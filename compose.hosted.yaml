x-runtime: &runtime
  build: .
  image: zhixu-rag:local
  env_file: .env.hosted
  environment:
    KB_DATABASE_URL: postgresql+psycopg://kb:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/kb
    KB_HOST: 0.0.0.0
    KB_ALLOWED_HOSTS: ${BACKEND_DOMAIN:?Set BACKEND_DOMAIN},localhost,127.0.0.1,api
  volumes:
    - ./data:/app/data
    - ./models:/app/models

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: kb
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U kb -d kb']
      interval: 5s
      timeout: 3s
      retries: 20

  models:
    <<: *runtime
    command: [python, scripts/download_models.py]
    restart: 'no'

  initialize:
    <<: *runtime
    command: [python, scripts/bootstrap_hosted.py]
    depends_on:
      postgres: {condition: service_healthy}
      models: {condition: service_completed_successfully}
    restart: 'no'

  api:
    <<: *runtime
    command: [kb, api]
    depends_on:
      initialize: {condition: service_completed_successfully}
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8780/health', headers={'Authorization': 'Bearer ' + os.environ['KB_ACCESS_TOKEN']}), timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 5

  worker:
    <<: *runtime
    command: [kb, worker]
    depends_on:
      initialize: {condition: service_completed_successfully}
    restart: unless-stopped
    stop_grace_period: 30s

  gateway:
    image: caddy:2
    environment:
      BACKEND_DOMAIN: ${BACKEND_DOMAIN:?Set BACKEND_DOMAIN}
    ports: [80:80, 443:443]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
