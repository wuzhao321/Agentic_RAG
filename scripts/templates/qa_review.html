<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>公开 QA 审核</title>
<style>body{max-width:980px;margin:32px auto;padding:20px;font:16px/1.6 system-ui;background:#f7f8fa;color:#172033}button,input,textarea{font:inherit;padding:8px;margin:4px}button{cursor:pointer}article{background:white;padding:24px;border:1px solid #ddd;border-radius:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f3f6;padding:16px}textarea{width:94%;height:64px}label{display:block}.toolbar{position:sticky;top:0;background:#f7f8fa;padding:12px}#status{font-weight:600}</style>
<h1>公开知识库 QA 审核</h1><p>逐条核对问题、答案和出处；需修改的题标记为驳回并说明原因。导出文件与候选集哈希绑定，用于导入审核记录。</p>
<div class="toolbar"><span id="status"></span><label>审核人 <input id="reviewer" placeholder="填写姓名或团队标识"></label><button id="prev">上一题</button><button id="next">下一题</button><button id="pending">下一条待审核</button><button id="export">导出审核 JSON</button></div>
<article><h2 id="title"></h2><p id="question"></p><h3>参考答案（候选）</h3><pre id="answer"></pre><h3>来源证据</h3><div id="sources"></div><label>审核备注<textarea id="notes"></textarea></label><button id="approve">批准此题</button><button id="reject">驳回此题</button><p id="decision"></p></article>
<script id="dataset" type="application/json">PAYLOAD</script><script>
const data=JSON.parse(document.getElementById('dataset').textContent),key='qa-review-'+data.sha256;
let state;try{state=JSON.parse(localStorage.getItem(key))}catch(e){}state=state||{reviews:{},reviewer:''};let i=0;
const el=id=>document.getElementById(id),save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch(e){el('decision').textContent='无法自动保存，请及时导出。'}};
el('reviewer').value=state.reviewer;el('reviewer').oninput=()=>{state.reviewer=el('reviewer').value;save()};
function render(){const r=data.rows[i],d=state.reviews[r.id];el('title').textContent=`${i+1}/200 · ${r.id} · ${r.question_type}`;el('question').textContent=r.question;el('answer').textContent=r.reference_answer;el('sources').replaceChildren();for(const c of r.reference_contexts){let a=document.createElement('a');a.textContent=c.doc_name;a.href=c.source_url;a.target='_blank';a.rel='noopener noreferrer';let p=document.createElement('pre');p.textContent=c.text;el('sources').append(a,p)}el('notes').value=d?.notes||'';el('decision').textContent=d?(d.approved?'已批准':'已驳回'):'待审核';const vals=Object.values(state.reviews);el('status').textContent=`已审核 ${vals.length}/200，批准 ${vals.filter(x=>x.approved).length}，驳回 ${vals.filter(x=>!x.approved).length}`}
function decide(approved){if(!state.reviewer.trim()){alert('请填写审核人');return}state.reviews[data.rows[i].id]={id:data.rows[i].id,approved,reviewer:state.reviewer.trim(),notes:el('notes').value,reviewed_at:new Date().toISOString()};save();render()}
el('approve').onclick=()=>decide(true);el('reject').onclick=()=>decide(false);el('prev').onclick=()=>{i=Math.max(0,i-1);render()};el('next').onclick=()=>{i=Math.min(199,i+1);render()};el('pending').onclick=()=>{const next=data.rows.findIndex((r,j)=>j>i&&!state.reviews[r.id]);i=next<0?data.rows.findIndex(r=>!state.reviews[r.id]):next;if(i<0)i=0;render()};
el('export').onclick=()=>{const blob=new Blob([JSON.stringify({dataset_sha256:data.sha256,reviews:Object.values(state.reviews)},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='qa-reviews.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();</script></html>
